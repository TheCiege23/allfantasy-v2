[phases.setup]
# Keep Railway on the same major Node version as package.json engines and .nvmrc.
# Nixpacks selects Node by major version; package.json/.nvmrc keep the local
# floor at 20.19.0 while Railway resolves the current Node 20 package.
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
# Keep Railway on the normal Next production path: clean .next, generate Prisma,
# then build once. Runtime keeps a Railway-only static stylesheet fallback so
# a transient Linux CSS-manifest extraction miss cannot ship a blank page.
cmds = ["npx prisma generate", "npm run build:railway"]

[start]
cmd = "npm run start:railway"
