[phases.setup]
# Node.js 20.18.1 (the version provided by nodejs_20 in Railway's Nix channel) is below
# the >=20.19.0 minimum required by @csstools/css-tokenizer and @asamuzakjp/css-color, which
# are ESM-only packages loaded by PostCSS/Tailwind.  On Node <20.19 those packages fail to
# load via require(), PostCSS silently produces empty CSS, mini-css-extract-plugin skips the
# file, and app-build-manifest.json has no CSS entry for /layout → unstyled pages.
# Node.js 22.x LTS satisfies '^22.12.0 || >=24' (all package requirements) and is safe.
nixPkgs = ["nodejs_22", "openssl"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
# Clear BOTH persistent Docker cache volumes before each build:
#   .next/cache/webpack  — webpack filesystem cache (can contain stale module graphs)
#   node_modules/.cache  — postcss-loader transform cache (was poisoned with 0-byte CSS
#                          when tailwind.config.ts → .js migration ran with jiti errors;
#                          must be nuked so postcss-loader re-runs Tailwind from scratch)
# railway.json buildCommand overrides these cmds at deploy time but may lag one build
# behind due to Railway's plan-caching; specifying here ensures the clear always runs.
cmds = ["rm -rf .next/cache/webpack node_modules/.cache", "npm run build"]

[start]
cmd = "npm run start"
