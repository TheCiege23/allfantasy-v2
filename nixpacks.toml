[phases.setup]
# Node.js 20.18.1 (the version provided by nodejs_20 in Railway's Nix channel) is below
# the >=20.19.0 minimum required by @csstools/css-tokenizer and @asamuzakjp/css-color, which
# are ESM-only packages loaded by PostCSS/Tailwind.  On Node <20.19 those packages fail to
# load via require(), PostCSS silently produces empty CSS, mini-css-extract-plugin skips the
# file, and app-build-manifest.json has no CSS entry for /layout → unstyled pages.
# Node.js 22.x LTS satisfies '^22.12.0 || >=24' (all package requirements) and is safe.
nixPkgs = ["nodejs_22", "openssl"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
# Clear the webpack filesystem cache before every build.  The Docker cache
# mount (--mount=type=cache,target=/app/.next/cache) persists this directory
# across builds keyed to the service ID.  When the previous build ran on
# Node 20.18.1 it cached empty CSS (PostCSS couldn't require() ESM-only
# @csstools/* packages); that empty-CSS result is then reused on Node 22
# builds even though PostCSS now works correctly.  Clearing here ensures
# webpack always compiles CSS from scratch regardless of what was cached.
cmds = ["rm -rf .next/cache/webpack && npm run build"]

[start]
cmd = "npm run start"
