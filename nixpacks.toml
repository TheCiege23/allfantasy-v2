[phases.setup]
# Keep Railway on the same major Node version as package.json engines and .nvmrc.
# Nixpacks selects Node by major version; package.json/.nvmrc keep the local
# floor at 20.19.0 while Railway resolves the current Node 20 package.
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
# Clear the webpack filesystem cache before each build to prevent stale module graphs.
# NOTE: Do NOT try to rm -rf node_modules/.cache; that directory is the Docker
# cache mount target and removing the mount point itself can fail as busy.
# The postcss-loader cache is invalidated naturally: the prebuild script
# replaces app/globals.css with precompiled Tailwind CSS before next build runs,
# so the cache key changes and postcss-loader gets a cache miss.
#
# postcss.config.js uses tailwindcss + autoprefixer on all environments.
# On Railway, globals.css is already compiled, so the tailwindcss PostCSS plugin
# is a passthrough; autoprefixer adds prefixes and mini-css-extract-plugin
# extracts the CSS chunk normally.
cmds = ["node scripts/railway-clean-next-build.cjs", "npx prisma generate", "npm run build", "node scripts/railway-patch-app-build-manifest.cjs", "node scripts/railway-verify-next-build.cjs"]

[start]
cmd = "npm run start:railway"
